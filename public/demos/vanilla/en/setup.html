<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cytoscape.js - VanillaJS Implementation</title>
    <!-- Load Cytoscape.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <style>
      #cy {
        width: 600px;
        height: 400px;
        border: 1px solid #ccc;
        margin: 20px auto;
      }
      .controls {
        text-align: center;
        margin: 20px;
      }
    </style>
  
<link rel="stylesheet" href="/demo-frame.css"/>
<link rel="stylesheet" href="/demo-controls.css"/>
</head>
  <body class="demo-frame-body">
    <div id="cy"></div>
    <script>
      const cy = cytoscape({
        container: document.getElementById("cy"),
        elements: [
          { data: { id: "a" } },
          { data: { id: "b" } },
          { data: { id: "c" } },
          { data: { id: "ab", source: "a", target: "b" } },
          { data: { id: "bc", source: "b", target: "c" } },
        ],
        style: [
          {
            selector: "node",
            style: {
              "background-color": "#0284c7",
              width: 48,
              height: 48,
              color: "#fff",
              "text-valign": "center",
              "text-halign": "center",
              label: "data(id)",
            },
          },
          {
            selector: "edge",
            style: {
              width: 2,
              "line-color": "#94a3b8",
              "target-arrow-color": "#94a3b8",
              "target-arrow-shape": "triangle",
              "curve-style": "bezier",
            },
          },
        ],
        layout: {
          name: "grid",
          rows: 1,
          padding: 40,
        },
      });
    </script>
  <script src="/demo-frame.js"></script>
</body>
</html>
